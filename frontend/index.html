<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Alef</title>

  <link rel="icon" href="favicon.png">

  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="loader" id="appLoader" aria-hidden="true">
        <img src="assets/img/alef_logo.png" alt="alef_logo" />
    </div>

    <div class="story">
        <img src="assets/img/legacy.png" alt="legacy" class="legacy-img">
        <div class="story_photo_container_top">
            <img src="assets/img/p1.png" alt="person1" class="person-img p1">
            <img src="assets/img/p2.png" alt="person2" class="person-img p2">
        </div>
        <div class="story_photo_container_bottom">
            <img src="assets/img/p3.png" alt="person3" class="person-img p3">
            <img src="assets/img/p4.png" alt="person4" class="person-img p4">
        </div>
    </div>
    <div class="intro_section">
        <div class="header">
            <img src="assets/img/alef_logo.png" alt="alef_logo" />
        </div>
        <div class="baner">
            <img src="assets/img/baner.png" alt="baner" />
            <img src="assets/img/cloud.png" alt="cloud" class="cloud left" />
            <img src="assets/img/cloud.png" alt="cloud" class="cloud right" />
        </div>
        <div class="intro_text_div">
            <p class="intro_title">همکار عزیز، به مسابقه‌ی یلدایی «الف» خوش اومدی!</p>
            <p class="intro_text">قراره به مناسبت یلدا، هویت الف و زیرمجموعه‌هاش رو بهتر بشناسی و با چالش سرعت و دقت، برنده‌ی یکی از ۵ جاروبرقی Flow پاکشوما بشی.</p>
            <p class="intro_title">یلدا مبارک و مسیرت درخشان!</p>
        </div>
        <div class="anar_div">
            <img src="assets/img/BG_anaar.png" alt="anar" class="anar_img left" />
            <img src="assets/img/BG_anaar.png" alt="anar" class="anar_img right" />
        </div>
        <div class="next_btn_div">
            <button class="continue_btn">ادامه</button>
        </div>
        <div class="footer">
            <p class="text">Powered by <span>Alef Corporation</span></p>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
